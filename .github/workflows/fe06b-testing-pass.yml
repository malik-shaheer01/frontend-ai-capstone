name: FE-06B Testing Pass

on:
  push:
    paths:
      - "assignments/week6-testing-pass/app/**"
      - ".github/workflows/fe06b-testing-pass.yml"
  pull_request:
    paths:
      - "assignments/week6-testing-pass/app/**"
      - ".github/workflows/fe06b-testing-pass.yml"

defaults:
  run:
    working-directory: assignments/week6-testing-pass/app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assignments/week6-testing-pass/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Unit and component tests (Vitest)
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end test (Playwright)
        run: npm run e2e
