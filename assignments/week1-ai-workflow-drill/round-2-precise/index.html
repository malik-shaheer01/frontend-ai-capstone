<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">

<main class="w-full max-w-md bg-white rounded-lg shadow p-6">
  <h1 class="text-xl font-semibold mb-4">Account settings</h1>

  <div id="formSummary" class="text-sm text-red-600 mb-3" role="alert" aria-live="polite"></div>
  <div id="formSuccess" class="text-sm text-green-700 mb-3" role="status" hidden></div>

  <form id="settingsForm" novalidate>
    <div class="mb-4">
      <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
      <input type="text" id="name" name="name"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        aria-describedby="nameError">
      <p id="nameError" class="text-sm text-red-600 mt-1"></p>
    </div>

    <div class="mb-4">
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="text" id="email" name="email"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        aria-describedby="emailError">
      <p id="emailError" class="text-sm text-red-600 mt-1"></p>
    </div>

    <div class="mb-6 flex items-center gap-2">
      <input type="checkbox" id="notifications" name="notifications" class="h-4 w-4">
      <label for="notifications" class="text-sm text-gray-700">Email me about updates</label>
    </div>

    <button type="submit" class="w-full bg-blue-600 text-white rounded px-4 py-2 hover:bg-blue-700">
      Save
    </button>
  </form>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
